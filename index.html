    <style>
      /* The splash screen. public/boot.js turns it on in the installed app (or with ?splash) and
         takes it away; it starts as the launch image left off (scripts/splash.mjs): the mark,
         120 pt, in the middle of the screen on the system's page colour, not the saved theme's,
         because iOS picks the launch image by the system's (as it was when the app was added to
         the home screen). Then the back cards fan out and settle, a glint crosses the tile, and
         the splash fades into the app. */
      #splash {
        display: none;
      }
      .splash #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #09090b;
        touch-action: none;
      }
      @media (prefers-color-scheme: light) {
        .splash #splash {
          background: #f5f4f1;
        }
      }
      #splash svg {
        width: 120px;
        height: 120px;
        /* Should the page start below the status bar, boot.js lifts the mark to the screen's centre. */
        translate: 0 calc(-1 * var(--splash-lift, 0px));
      }
      #splash .sp-l,
      #splash .sp-r,
      #splash .sp-f,
      #splash .sp-glint {
        transform-box: view-box;
        /* Longhands: Vite's minifier turns a shorthand without a name into `animation: none`. */
        animation-duration: 560ms;
        animation-timing-function: cubic-bezier(0.45, 0, 0.25, 1);
        animation-delay: 60ms;
        animation-fill-mode: both;
      }
      #splash .sp-l {
        transform-origin: 512px 1010px;
        animation-name: splash-l;
      }
      #splash .sp-r {
        transform-origin: 512px 1010px;
        animation-name: splash-r;
      }
      #splash .sp-f {
        transform-origin: 512px 534px;
        animation-name: splash-f;
      }
      #splash .sp-glint {
        animation-name: splash-glint;
        animation-duration: 640ms;
      }
      @keyframes splash-l {
        45% {
          transform: rotate(-8deg);
        }
      }
      @keyframes splash-r {
        45% {
          transform: rotate(8deg);
        }
      }
      @keyframes splash-f {
        45% {
          transform: translateY(-28px) scale(1.04);
        }
      }
      @keyframes splash-glint {
        to {
          transform: translateX(2000px);
        }
      }
      .splash-out #splash {
        opacity: 0;
        pointer-events: none;
        transition: opacity 320ms ease;
      }
      .splash-out #splash svg {
        scale: 1.08;
        transition: scale 320ms cubic-bezier(0.3, 0, 0.2, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-l,
        #splash .sp-r,
        #splash .sp-f,
        #splash .sp-glint {
          animation: none;
        }
        .splash-out #splash {
          transition-duration: 200ms;
        }
        .splash-out #splash svg {
          scale: none;
        }
      }
    </style>
